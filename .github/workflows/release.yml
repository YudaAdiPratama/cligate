name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: cligate-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: cligate-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: cligate-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: cligate-macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: |
          cargo build --release
          cp target/release/cligate ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" "${{ matrix.asset_name }}" --clobber
