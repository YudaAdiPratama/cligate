[package]
name = "cligate"
version = "0.3.1"
edition = "2021"
description = "OpenAI-compatible gateway and per-agent fallback router powered by local AI CLI OAuth sessions (Claude Code, Codex, AGY) — zero API keys, zero dependencies."
readme = "README.md"
license = "MIT"
authors = ["Yuda Adi Pratama <yuda@nodespark.org>"]
repository = "https://github.com/YudaAdiPratama/cligate"
keywords = ["openai", "gateway", "router", "oauth", "cli"]
